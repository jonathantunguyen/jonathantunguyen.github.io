name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Lets you re-deploy without a commit, from the Actions tab.
  workflow_dispatch:

# Pages deployment needs these; `id-token` is what proves the artifact came
# from this workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling, so a push mid-deploy
# still ends up published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Lint and typecheck here rather than after publishing: a broken build
      # should stop the deploy, not become the live site.
      - run: npm run lint
      - run: npx tsc --noEmit

      - name: Build static export
        env:
          # Absolute origin for canonical URLs, hreflang alternates and the
          # sitemap. Without it those would point at localhost.
          NEXT_PUBLIC_SITE_URL: https://jonathantunguyen.github.io
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
